  <section id="wir" class="wir abschnitt">

      <p class="wir__leise"><span class="luecke">[1–2 SÄTZE ZU EUCH EINFÜGEN — z. B. wie ihr angefangen habt]</span></p>

        <div class="slot" style="--ratio: 4 / 5">
          <p class="slot__hinweis"><span>Slot · Porträt</span><span>4:5</span></p>
        </div>
        <figcaption><span>[NAME EINFÜGEN]</span><span>[ROLLE, z. B. Gestaltung]</span></figcaption>
      </figure>
      <figure class="person person--versetzt reveal">
        <div class="slot" style="--ratio: 4 / 5">
          <p class="slot__hinweis"><span>Slot · Porträt</span><span>4:5</span></p>
        </div>
        <figcaption><span>[NAME EINFÜGEN]</span><span>[ROLLE, z. B. Technik]</span></figcaption>
      </figure>
    </div>
